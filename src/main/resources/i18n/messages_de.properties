# ---------------------------------------------------------------- How to play
how.title=SPIELANLEITUNG
how.1.sub=1. Der Fall
how.1.body=Ein Mord wurde begangen, und der Mörder ist einer der Ermittler in eurer Gruppe.\n\nUm den Fall zu lösen, müssen die Ermittler drei Dinge benennen:\nden <b>Mörder</b>, die <b>Tatwaffe</b> und das <b>Schlüsselbeweisstück</b>.\n\nEin Fall braucht 4 bis 7 Spieler und dauert etwa 15 Minuten.
how.2.sub=2. Die Ausgangslage
how.2.body=• Die Rollen werden in deinem privaten Chat mit mir verteilt.\n• Jeder Spieler außer dem Forensiker bekommt 4 Tatwaffen-Karten 🔪 und 4 Beweis-Karten 🔍. Die Beweistafel zeigt sie allen.\n• Der Mörder wählt heimlich eine eigene Tatwaffen-Karte und eine eigene Beweis-Karte. Dieses Paar ist die Lösung.\n• 🐟 Dann legt der Mörder eine falsche Spur: Er markiert eine Tatwaffen-Karte und eine Beweis-Karte eines anderen Spielers.\n• Der Forensiker kennt die Lösung, aber nicht die falsche Spur.
how.3.sub=3. Der Tatortbericht
how.3.body=Der Forensiker beantwortet sechs Tatortkarten, indem er auf jeder eine Option wählt.\n\n🔪 Karten beschreiben die Tatwaffe, zum Beispiel <i>Todesursache</i>.\n🔍 Karten beschreiben das Schlüsselbeweisstück, zum Beispiel <i>Das Beweisstück besteht aus</i>.\n\nJede Antwort schließt also Karten ein oder aus. Ein Fall hat 3 Runden. In Runde 2 und 3 wählt der Forensiker eine der neuen Karten und ersetzt eine alte Antwort.\n👤 Einmal pro Fall darf er stattdessen <i>Profil des Mörders</i> wählen und ein allgemeines Detail über den Mörder geben.
how.4.sub=4. Das Labor und die falsche Spur
how.4.body=🔬 In jeder Runde darf jeder Verdächtige eine beliebige Karte vom Brett ins Labor schicken. Alle sehen das Ergebnis.\n\n🩸 <b>Spur gefunden</b>: Die Karte gehört zur Tat, oder der Mörder hat sie untergeschoben.\n▫️ <b>Sauber</b>: Die Karte scheidet aus.\n\nVier Karten hinterlassen eine Spur: die zwei echten und die zwei untergeschobenen. Eine Spur führt zum Mörder, die andere zu einem Unschuldigen. Nur der Tatortbericht beschreibt die echte.
how.5.sub=5. Den Fall lösen
how.5.body=Tippe jederzeit auf <b>Fall lösen</b> und nenne einen Spieler, eine seiner Tatwaffen-Karten und eine seiner Beweis-Karten.\n\n✅ Alle drei richtig: Die Ermittler und der Forensiker gewinnen.\n❌ Falsch: Die Antwort ist nur „Nein", und dein einziger Versuch ist verbraucht.\n🐟 Der hereingelegte Spieler mit beiden untergeschobenen Karten: Ein Unschuldiger wird verurteilt, und der Mörder gewinnt sofort.\n🎭 Auch der Mörder darf anklagen, um nicht aufzufallen. Seine Anklage wird immer mit „Nein" beantwortet.\n\nDer Mörder gewinnt auch, wenn Runde 3 ohne Lösung endet oder jeder Ermittler seinen Versuch verbraucht hat.

