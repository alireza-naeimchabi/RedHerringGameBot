roles.murderer.who=Du hast die Tat begangen und sitzt mitten unter den Ermittlern.
roles.murderer.task=Wähle deine zwei Karten und lege dann eine falsche Spur zu einem anderen Spieler: zwei seiner Karten, die zur selben Geschichte passen. Nutze deine Labortests, um in die Irre zu führen. Du darfst Fall lösen nutzen, um nicht aufzufallen, aber deine Anklage wird immer mit „Nein" beantwortet.
