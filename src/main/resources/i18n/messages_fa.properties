# ---------------------------------------------------------------- How to play
how.title=راهنمای بازی
how.1.sub=۱. پرونده
how.1.body=قتلی رخ داده و قاتل یکی از کارآگاه‌های گروه شماست.\n\nبرای حل پرونده، کارآگاه‌ها باید سه چیز را پیدا کنند:\n<b>قاتل</b>، <b>ابزار قتل</b> و <b>مدرک کلیدی</b>.\n\nهر پرونده ۴ تا ۷ بازیکن می‌خواهد و حدود ۱۵ دقیقه طول می‌کشد.
how.2.sub=۲. چیدن صحنه
how.2.body=• نقش‌ها در گفت‌وگوی خصوصی با من داده می‌شوند.\n• هر بازیکن، به‌جز کارشناس صحنه‌ی جرم، ۴ کارت ابزار 🔪 و ۴ کارت مدرک 🔍 می‌گیرد. تابلوی مدارک آن‌ها را به همه نشان می‌دهد.\n• قاتل پنهانی یکی از کارت‌های ابزار و یکی از کارت‌های مدرک خودش را انتخاب می‌کند. این دو کارت جواب پرونده‌اند.\n• 🐟 بعد قاتل برای بازیکن دیگری پاپوش می‌دوزد: یک کارت ابزار و یک کارت مدرک او را علامت می‌زند. این همان سرنخ جعلی است.\n• کارشناس صحنه‌ی جرم جواب را می‌داند، اما از سرنخ جعلی خبر ندارد.
how.3.sub=۳. گزارش صحنه
how.3.body=کارشناس صحنه‌ی جرم به شش کاشی صحنه جواب می‌دهد و روی هر کدام یک گزینه را انتخاب می‌کند.\n\nکاشی‌های 🔪 ابزار قتل را توصیف می‌کنند، مثل <i>علت مرگ</i>.\nکاشی‌های 🔍 مدرک کلیدی را توصیف می‌کنند، مثل <i>جنس مدرک کلیدی</i>.\n\nپس هر جواب بعضی کارت‌ها را محتمل‌تر می‌کند و بعضی را کنار می‌گذارد. هر پرونده ۳ دور دارد. در دور ۲ و ۳ کارشناس یکی از کاشی‌های تازه را انتخاب می‌کند و آن را جای یکی از جواب‌های قبلی می‌گذارد.\n👤 کارشناس در هر پرونده یک بار می‌تواند به‌جای آن <i>ویژگی کلی قاتل</i> را انتخاب کند و یک ویژگی کلی از قاتل بگوید.
how.4.sub=۴. آزمایشگاه و سرنخ جعلی
how.4.body=🔬 در هر دور، هر مظنون می‌تواند یک کارت را به آزمایشگاه بفرستد؛ هر کارتی که روی تابلو باشد. نتیجه را همه می‌بینند.\n\n🩸 <b>رد پیدا شد</b>: کارت یا واقعاً بخشی از جنایت است یا قاتل آن را جعل کرده است.\n▫️ <b>پاک</b>: این کارت کنار می‌رود.\n\nروی چهار کارت رد پیدا می‌شود: دو کارت واقعی و دو کارت جعلی. یک مسیر به قاتل می‌رسد و دیگری به یک بی‌گناه. فقط گزارش صحنه است که مسیر واقعی را توصیف می‌کند.
how.5.sub=۵. حل پرونده
how.5.body=وقتی همه‌ی مظنون‌ها نوبتشان را رفتند، هر کسی می‌تواند روی <b>حل پرونده</b> بزند و یک اتهام پیشنهاد کند: یک بازیکن، یکی از کارت‌های ابزار و یکی از کارت‌های مدرک او.\n\n🗳 بعد گروه رأی می‌دهد. هر مظنون یک رأی دارد، قاتل هم. اگر بیش از نیمی موافق باشند، اتهام به کارشناس صحنه‌ی جرم سپرده می‌شود.\n\n✅ هر سه درست باشد: کارآگاه‌ها و کارشناس صحنه‌ی جرم برنده‌اند.\n❌ هر چیزی اشتباه باشد: گروه فقط <b>یک</b> اتهام دارد، پس قاتل برنده است.\n🐟 اگر قربانی پاپوش را با هر دو کارت جعلی متهم کنید: یک بی‌گناه محکوم می‌شود و قاتل برنده است.\n\nاگر گروه پیشنهادی را رد کند، پرونده ادامه پیدا می‌کند. هر نفر در هر دور یک اتهام می‌تواند پیشنهاد کند. اگر دور ۳ بدون اتهام تمام شود هم قاتل برنده است.

