# English texts of the bot. This is the default language: every key must exist here.
#
# Rules for this file and its translations:
#  - {0}, {1}, ... are replaced by values. Keep them in every translation.
#  - Texts for messages may use the HTML tags <b>, <i>, <s> and <code>.
#  - Texts under "btn.", "nav.", "err.", "toast.", "join." and "cmd." are shown on buttons,
#    in pop-ups or in menus, where HTML does not work: no tags there.
#  - "\n" starts a new line.
#  - Keys ending in ".one" and ".other" are the forms for exactly one and for any other count.

