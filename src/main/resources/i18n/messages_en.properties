# ---------------------------------------------------------------- How to play
how.title=HOW TO PLAY
how.1.sub=1. The case
how.1.body=A murder has been committed, and the murderer is one of the investigators in your group.\n\nTo solve the case, the investigators must name three things:\nthe <b>murderer</b>, the <b>Means of Murder</b> and the <b>Key Evidence</b>.\n\nOne case takes 4 to 7 players and about 15 minutes.
how.2.sub=2. Setting the scene
how.2.body=• Roles are dealt in your private chat with me.\n• Every player except the Forensic Scientist gets 4 means cards 🔪 and 4 clue cards 🔍. The Evidence Board shows them to everyone.\n• The murderer secretly picks one of their own means cards and one of their own clue cards. This pair is the solution.\n• 🐟 Then the murderer frames another player by marking one means card and one clue card of theirs: the red herring.\n• The Forensic Scientist learns the solution, but not the red herring.
how.3.sub=3. The scene report
how.3.body=The Forensic Scientist answers six scene tiles by picking one option on each.\n\n🔪 tiles describe the Means of Murder, for example <i>Cause of death</i>.\n🔍 tiles describe the Key Evidence, for example <i>The key evidence is made of</i>.\n\nSo every answer rules cards in or out. A case has 3 rounds. In rounds 2 and 3 the Forensic Scientist chooses one of the new tiles and replaces an old answer.\n👤 Once per case they may choose <i>Profile of the murderer</i> instead and give one general detail about the murderer.
how.4.sub=4. The lab and the red herring
how.4.body=🔬 Every round each suspect may send one card to the lab, any card on the board. Everyone sees the result.\n\n🩸 <b>Trace found</b>: the card is part of the crime, or the murderer planted it.\n▫️ <b>Clean</b>: the card is out.\n\nFour cards leave a trace: the two real ones and the two planted ones. One trail leads to the murderer, the other to an innocent player. Only the scene report describes the real one.
how.5.sub=5. Solving the crime
how.5.body=Tap <b>Solve the Crime</b> at any time and name a player, one of their means cards and one of their clue cards.\n\n✅ All three correct: the investigators and the Forensic Scientist win.\n❌ Wrong: the answer is only "no", and your single attempt is used.\n🐟 The framed player with both planted cards: an innocent is convicted and the murderer wins at once.\n🎭 The murderer may accuse too, to stay hidden. Their accusation is always answered "no".\n\nThe murderer also wins if round 3 ends unsolved, or if every investigator has used their attempt.

# ---------------------------------------------------------------- Role cards (dashboard)
roles.job=Your job
roles.goal=Your goal
roles.not_in_bot=Not part of this bot yet. Cases here use the three standard roles.
roles.scientist.name=FORENSIC SCIENTIST
roles.scientist.kind=Standard role, one per case
roles.scientist.who=You know the murderer and the solution, and you lead the investigation without saying a word about it.
roles.scientist.task=Answer the scene tiles so they fit the real cards and not the planted ones. In rounds 2 and 3 choose one of two new tiles and replace an old answer.
roles.scientist.goal=Someone solves the crime. You win together with the investigators.
roles.murderer.name=MURDERER
roles.murderer.kind=Standard role, one per case
roles.murderer.who=You committed the crime and sit among the investigators.
roles.murderer.task=Pick your two cards, then plant a red herring on another player: two of their cards that fit the same story. Use your lab tests to mislead. You may use Solve the Crime to blend in, but your accusation is always answered "no".
roles.murderer.goal=Nobody names you with both of your cards, or someone convicts the player you framed.
roles.investigator.name=INVESTIGATOR
roles.investigator.kind=Standard role, everyone else
roles.investigator.who=You read the scene report and look for the cards it describes.
roles.investigator.task=Send one card to the lab every round. When two trails show up, work out which one the scene report really describes before you accuse.
roles.investigator.goal=Any investigator names the murderer, the Means of Murder and the Key Evidence.
roles.accomplice.name=ACCOMPLICE
roles.accomplice.kind=Optional role in the board game, from 6 players
roles.accomplice.who=You know the murderer and the solution and help them get away.
roles.accomplice.task=Protect the murderer in the discussion without exposing yourself.
roles.accomplice.goal=The murderer gets away. You win together.
roles.witness.name=WITNESS
roles.witness.kind=Optional role in the board game, with the Accomplice
roles.witness.who=You saw the two culprits leave, but not who of them did it or how.
roles.witness.task=Guide the investigators quietly. If the murderer is caught but can point you out afterwards, the culprits still escape.
roles.witness.goal=The crime is solved and the murderer cannot point you out.

